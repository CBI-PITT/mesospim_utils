general:
  location_module: '/h20/home/lab/src/mesospim_utils/mesospim_utils' # interpreter paths derive from this: main tools run as `uv run --project <repo root> python -u <script>` (uv sync in the repo creates .venv); basicpy runs as `uv run --project <repo root>/basicpy_env python`
  location_pyimariswriter_environment: '/h20/home/lab/miniconda3/envs/pyiw/bin/python' # conda env: PyImarisWriter cannot be uv-ified (Windows-only PyPI wheel, Linux .so with env-specific RPATH)
  metadata_filename: 'mesospim_metadata.json'
  metadata_annotated_filename: 'mesospim_annotated_metadata.json'
  montage_name: 'auto_montage.ims'
  verbose: 1 # true/false or 0-2. 0=off, 1-2 are increasing levels of verbosity. true==1
  overide_stage_direction: true # true, don't use stage direction for stitch/resample

  # Drive mappings for linux directories in WINDOWS for ims file conversions
  windows_mappings: #linux_path:windows_mapped_drive_letter:
    '/h20': 'i:'
    '/CBI_FastStore': 'z:'

  # Drive mappings for linux directories in WINE for ims file conversions
  wine_mappings: #linux_path:wine_drive_letter:
    '/h20': 'h:'
    '/CBI_FastStore': 'f:'

  emission_map:
    #Mapping common names to emission wavelengths, only used if wavelength is not explicitly stated in metadata file
    "emp": 405
    "dapi": 450
    "hoechst": 450
    "gfp": 525
    "yfp": 525
    "green": 525
    "rfp": 595
    "red": 595
    "cy5": 665
    "far_red": 665
    "cy7": 790

  emission_to_rgb:
    # Mapping emission range to RGB colors
    # Keys are wavelength ranges in nm
    # Values are (R,G,B)
    'default': [ 0.5, 0.5, 0.5 ]
    '300-479': [ 0, 0, 1 ]
    '480-540': [ 0, 1, 0 ]
    '541-625': [ 1, 0, 0 ]
    '627-730': [ 1, 0, 0.75 ]
    '731-2000': [ 0.75, 0, 1 ]

  username_pattern: '[\\/]([a-z]+-[a-z])[\\/]'
    # example: holmes-s


decon:
  script: 'rl.py'
  output_dir: 'decon'
  psf_threshold: 1.0e-5 # Automatically reduce PSF size to exclude values below this.
  vram_per_voxel: 2.36837e-5 # 17136 / ((3200+15) * (3200+15) * 70) # Approximation based on real data
  max_vram: 24576 # value == vram available from nvidia-smi, It will be multiplied by margin_vram
  margin_vram: 0.95 # Arbitrary factor <= 1 to ensure that we don't over fill the GPU and cause a crash.
  default_objective: 'Nikon_A2_Plan_Apo_4x'
  objectives:
    Nikon_A2_Plan_Apo_4x:
      numerical_aperture: 0.4
      objective_immersion_ri_design: 1.000293  # Air objective design RI
      objective_immersion_ri_actual: 1.000293  # Air during experiment
      objective_working_distance_mm: 20
      coverslip_ri_design: 1.000293
      coverslip_ri_actual: 1.515
      coverslip_thickness_actual_mm: 1.0
      coverslip_thickness_design_mm: 0
    mesospim_air_2x:
      numerical_aperture: 0.2
      objective_immersion_ri_design: 1.000293  # Air objective design RI
      objective_immersion_ri_actual: 1.000293  # Air during experiment
      objective_working_distance_mm: 45
      coverslip_ri_design: 1.000293
      coverslip_ri_actual: 1.515
      coverslip_thickness_actual_mm: 1.0
      coverslip_thickness_design_mm: 0
    nikon_20x_multi_immersion:
      numerical_aperture: 1.0
      objective_immersion_ri_design: 'auto'  # 'auto' multi-immersion objective design RI, will be set to actual RI'
      objective_immersion_ri_actual: 'auto'  # 'auto' multi-immersion objective design RI, will be set to actual RI'
      objective_working_distance_mm: 8.2
      coverslip_ri_design: 0
      coverslip_ri_actual: 0
      coverslip_thickness_actual_mm: 0
      coverslip_thickness_design_mm: 0

align:
  directory: 'align'
  resolution_level_for_align: 3
  correlation_threshold_for_alignment: 0.6
  remove_outliers: true # true/false remove alignment outliers before calculating offsets
  offset_metric: 'median' # 'mean', 'median', default='median'
  align_output_file_name: 'tile_offsets_microns.json'
                                    # All alignment will be stored as all_{align_output_file_name},
                                    # average parameters will be stored as {offset_metric}_{align_output_file_name}

resample:
  use_separate_align_data_per_sheet: false # true, different stitch for left and right sheet,
                                          #false, same stitch regardless of sheet

ims_converter:
  wine_install_location: '/h20/home/lab/src/wine/wine64'
  imaris_installer_location: '/h20/home/lab/src/ImarisFileConverter 10.2.0/ImarisConvert.exe'
  compression_level: 6 #1-9

imaris_stitcher:

  ## Change this path for any specific installation of ImarisStitcher
  ## Paths are local to the maching running Imaris Stitcher
  path_to_imaris_stitcher_folder: "C:\\Program Files\\Bitplane\\ImarisStitcher 10.2.0"
  path_to_imaris_stitcher_temp_folder: "Z:\\tmp\\stitch_tmp_files" # If set to None, will default to windows user Temp directory

  shared_windows_path_where_win_client_job_files_are_stored: "Z:\\tmp\\stitch_jobs"
  shared_linux_path_where_win_client_job_files_are_stored: "/CBI_FastStore/tmp/stitch_jobs"
  correlation_threshold_for_alignment: 0.6
  percentage_of_machine_resources_to_use_for_stitching: 0.2
  fraction_of_ram_for_processing: 0.2
  compression_level: 6 #1-9

slurm:
  dependencies:
    # Low resource required to run a small scripts for spinning off new processes
    # Should take less than 1 minute to run
    'PARTITION': 'compute,gpu' #multiple partitions can be specified with comma separation part1,par2
    'CPUS': 1
    'JOB_LABEL': 'dev_depends'
    'RAM_GB': 4
    'GRES': # Specific exactly as it would be in slurm eg. "gpu:1" or None
    'PARALLEL_JOBS': 1
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
  decon:
    # Deconvolution tasks require a CUDA GPU
    'PARTITION': 'gpu' #multiple partitions can be specified with comma separation part1,par2
    'CPUS': 1
    'JOB_LABEL': 'dev_decon'
    'RAM_GB': 1300 # Acts of max RAM allocation based on how it is implemented in rl.py
    'GRES': 'gpu:1' # Specific exactly as it would be in slurm eg. "gpu:1", or shard:4, or None
    'PARALLEL_JOBS': 32 # In a slurm array, how many jobs will run in parallel
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
  basicpy:
    'PARTITION': 'ai'
    'CPUS': 1
    'JOB_LABEL': 'dev_basicpy'
    'RAM_GB': 512
    'GRES': 'gpu:1'
    'PARALLEL_JOBS': 8
    'NICE': 0
    'TIME_LIMIT':
  gain_correction:
    'PARTITION': 'gpu'
    'CPUS': 1
    'JOB_LABEL': 'dev_gaincorr'
    'RAM_GB': 512
    'GRES':
    'PARALLEL_JOBS': 8
    'NICE': 0
    'TIME_LIMIT':
  align:
    # MeosSPIM built in alignment tool *align_py.py  ** NOT imaris stitcher **
    'PARTITION': 'compute,gpu' #multiple partitions can be specified with comma separation part1,par2
    'CPUS': 24
    'JOB_LABEL': 'dev_align'
    'RAM_GB': 64
    'GRES': # Specific exactly as it would be in slurm eg. "gpu:1" or None
    'PARALLEL_JOBS': 1
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
  ims_convert:
    # WINE-based ImarisConverter for converting MesoSPIM data to ims ** This is not ImarisStitcher **
    'PARTITION': 'compute' #multiple partitions can be specified with comma separation part1,par2
    'CPUS': 24
    'JOB_LABEL': 'dev_ims_conv'
    'RAM_GB': 64
    'GRES': # Specific exactly as it would be in slurm eg. "gpu:1" or None
    'PARALLEL_JOBS': 20
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
  omezarr:
    # OME-Zarr conversion, uses ome_zarr_multiscale_writer
    'PARTITION': 'compute' #multiple partitions can be specified with comma separation part1,par2
    'CPUS': 24
    'JOB_LABEL': 'dev_omezarr'
    'RAM_GB': 64
    'GRES': # Specific exactly as it would be in slurm eg. "gpu:1" or None
    'PARALLEL_JOBS': 20
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
  bigstitcher:
    'PARTITION': 'gpu,ai' #multiple partitions can be specified with comma separation part1,par2'
    'CPUS': 56
    'JOB_LABEL': 'dev_bigstitcher'
    'RAM_GB': 1000
    'GRES':
    'PARALLEL_JOBS': 4
    'NICE': 0
    'TIME_LIMIT': # Specify a time limit for the job. This can kill jobs that get stuck but small times can also increase priority
fiji:
  # 'stable': Fiji stable archive + pinned classic BigStitcher 2.5.3 (reads OME-Zarr v0.4 / zarr v2 only)
  # 'latest': pinned Fiji-Latest archive build; BigStitcher 3.x + new N5 stack ship with it (adds OME-Zarr v0.5 sharded / zarr v3 reading)
  distribution: stable

# Raw-tile OME-Zarr converter (raw BTF -> source zarr, used before decon and stitching)
omezarr:
  # OME-Zarr version for the converter. Defaults to what the configured fiji.distribution
  # can read ('latest' -> 0.5 sharded zarr v3, 'stable' -> 0.4 zarr v2); this key overrides.
  ome_version: '0.5'
  # Shard shape (z,y,x) for the source tiles: each shard file holds this many voxels
  # (~8x fewer files than per-chunk writing). Only applies to 0.5 / zarr v3; ignored for 0.4.
  shard_shape: [512, 512, 512]

bigstitcher:
  fiji_install_folder: "" # If empty "", will use Fiji installed with mesospim_utils
  # Stage 1 global optimization link filtering thresholds (px)
  # Tuned by the auto-tune search on delima (winner lr7.0/la5.0, 68.0/100 vs 54.0 for 2.5/3.5):
  # link_absolute 5.0 is the dominant axis - cuts dropped links to 0-2 at every relative value
  link_relative: 7.0
  link_absolute: 5.0
  # Stage 2 ICP refinement
  icp_maximum_error: 5
  icp_lambda: 0.10
  downsample_in_x: 'automated' #4 # Controls the downsampling factor in X for Alignment in BigStitcher. 'overlap' computes the largest lateral downsample keeping the overlap strip >= min_overlap_strip_px
  downsample_in_y: 'automated' #4 # Controls the downsampling factor in X for Alignment in BigStitcher. 'overlap' computes it from the metadata overlap
  downsample_in_z: 'automated' #4 # Controls the downsampling factor in X for Alignment in BigStitcher
  # Adaptive overlap-driven downsampling target (px); used when downsample_in_x/y is 'overlap'
  min_overlap_strip_px: 150
  downsample_refinement: '8/8/4' # 'automated' # Controls the downsampling factor in X/Y/Z for the refinement step in BigStitcher. Suggest 8/8/4 or 4/4/2 for large datasets.
  # DoG detection intensity gating; macro keys verified against BigStitcher 3.0.8. 'off' preserves prior behavior
  dog_intensity_mode: 'off' # 'off' | 'common' (use_same_min_&_max_intensity_for_all_views=true) | 'fixed' (explicit values below)
  dog_min_intensity: 0.0
  dog_max_intensity: 65535.0
  # Self-calibration guard: warn (or rescale the fused voxel size) when the fitted grid scale differs from 1 by more than the threshold
  self_calibration_threshold_pct: 2.0
  self_calibration_correction: true # rescales the fused voxel size when the fitted grid scale differs from 1 by more than self_calibration_threshold_pct
  # Fused-output chunking: blocksize = the storage chunk (inner chunk in the sharded
  # zarr). Small z-chunks keep plane-wise reads cheap (napari, MAX projections, .ims
  # resampling all read the fused volume plane by plane); x/y sizes trade request
  # count vs per-request overhead.
  # blocksize_factor = how many chunks are fused and written at once (the compute
  # block). With sharding enabled, each compute block becomes one shard file, so
  # shard size = blocksize * blocksize_factor per axis (here 256x256x16 * 2/2/32 =
  # 512x512x512 voxels, ~256 MB). Larger factors give fewer, larger shards - better
  # write throughput on beegfs but more RAM per block; 512^3 is the measured sweet spot.
  blocksize_x: 256
  blocksize_y: 256
  blocksize_z: 16
  blocksize_factor_x: 2
  blocksize_factor_y: 2
  blocksize_factor_z: 32
  # Sharded OME-Zarr v0.5 fused output: writes each compute block as one shard file
  # (~8x fewer files than per-chunk writing). Macro key verified against the
  # multiview-reconstruction 9.0.12 dialog.
  enable_sharding: true
  subsampling_factors: 'automated' # "{{1,1,1}, {2,2,2}, {4,4,4}, {8,8,8}, {16,16,16}, {32,32,32}}"
  ram_fraction: 0.95 # 0-1, Fraction of allocated RAM to allocate to bigstitcher Java heap

########################################################################################################################
######### DEV Options ############
########################################################################################################################

dev:
  slurm_top_priority: false # If true this will run "scontrol top" to set priority above any running jobs
  # This will only apply to job from the user running the mesospim_utils pipeline
  # top will only work if slurm is configured to allow users to change job priority and if the user has permission to do so.
